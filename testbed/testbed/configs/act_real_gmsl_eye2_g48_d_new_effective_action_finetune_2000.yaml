# [Execution target G48/D: new-style reinforcement after mixed-data pretraining]
# This stage is intentionally pending until experiment C produces policy_best.ckpt.
experiment_contract:
  comparison_role: new_style_effective_action_finetune_candidate
  expected_num_epochs: 2000
  policy_action_scale: [1.0, 1.0, 1.0, 1.0]
  effective_action_enabled: true
  allow_pending_init_checkpoint: true
  forbidden_source_episode_ids: [105, 106, 107, 108, 109]
  forbidden_legacy_heldout_dataset: /data/pingfan/Excavator_real_stack_data/usb_hdf5_qc_20260709_105_109/real_teleop_v1_episodes_105_109_20hz

task:
  task_name: real_gmsl_eye2_g48_d_new_effective_action_finetune_2000
  equipment_model: real_excavator
  dataset_dir: /data/pingfan/Excavator_real_stack_data/g48_new_trainval_view_v1
  train_ready_manifest_path: /data/pingfan/Excavator_real_stack_data/g48_new_trainval_view_v1/train_ready_manifest.json
  num_episodes: 1000000
  episode_len:
  camera_names: [video4, video5]
  backend:
    name: real
    dt: 0.05

policy:
  class: ACT
  device: cuda
  low_dim_keys: [qpos]
  act_params:
    chunk_size: 20
    kl_weight: 10.0
    hidden_dim: 512
    dim_feedforward: 3200
    state_dim: 4

train:
  lr: 2.0e-6
  num_epochs: 2000
  batch_size: 4
  seed: 0
  device: cuda
  num_workers: 0
  prefetch_factor:
  persistent_workers: false
  pin_memory: true
  split_seed: 0
  train_split_ratio: 0.8571428571428571
  reuse_split: true
  split_path: /data/pingfan/Excavator_real_stack_data/g48_new_trainval_view_v1/train_val_split.yaml
  val_every: 10
  save_latest_every: 100
  checkpoint_every: 500
  plot_every: 500
  amp: true
  amp_dtype: auto
  ckpt_dir: /data/pingfan/Excavator_real_stack_data/runs/g48_act_training_preparation_20260714/training_runs/d_new_effective_action_finetune_2000/ckpt
  init_ckpt: /data/pingfan/Excavator_real_stack_data/runs/g48_act_training_preparation_20260714/training_runs/c_old_new_effective_action_2000/ckpt/policy_best.ckpt
  init_allow_missing: false
  state_hold_transition:
    enabled: false
  effective_action:
    enabled: true
    threshold_json: /data/pingfan/Excavator_real_stack_data/usb_hdf5_qc_20260708_72_104/runs/goal_state_hold_liveness_20260712/h2_transition_state_hold_finetune_e16_200/direct_policy_output_mechanical_deadzone.json
    neutral_weight: 1.0
    active_weight: 1.5
    persistent_weight: 1.75
    transition_weight: 4.0
    transition_window_steps: 4
    persistence_steps: 4
    active_margin: 0.02
    raw_continuity_weight: 0.35
    class_weights: [1.0, 4.0, 4.0]
    classification_weight: 0.05
    magnitude_weight: 0.10
