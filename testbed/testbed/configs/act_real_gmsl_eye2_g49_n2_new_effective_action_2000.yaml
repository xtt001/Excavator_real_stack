# [G49/N2: new-only G42-style effective-action semantics]
experiment_contract:
  experiment_id: g49_n2_new_eye2_effective_action
  comparison_role: effective_action_semantics_value_test
  expected_num_epochs: 2000
  expected_camera_names: [video4, video5]
  camera_role_encoding_enabled: false
  deadzone_loss_enabled: false
  state_hold_transition_enabled: false
  effective_action_enabled: true
  policy_action_scale: [1.0, 1.0, 1.0, 1.0]
  forbidden_source_episode_ids: [105, 106, 107, 108, 109]
  forbidden_legacy_heldout_dataset: /data/pingfan/Excavator_real_stack_data/usb_hdf5_qc_20260709_105_109/real_teleop_v1_episodes_105_109_20hz

task:
  task_name: real_gmsl_eye2_g49_n2_new_effective_action_2000
  equipment_model: real_excavator
  dataset_dir: /data/pingfan/Excavator_real_stack_data/g48_new_trainval_view_v1
  train_ready_manifest_path: /data/pingfan/Excavator_real_stack_data/g48_new_trainval_view_v1/train_ready_manifest.json
  num_episodes: 1000000
  episode_len:
  camera_names: [video4, video5]
  backend:
    name: real
    dt: 0.05

policy:
  class: ACT
  device: cuda
  low_dim_keys: [qpos]
  act_params:
    chunk_size: 20
    kl_weight: 10.0
    hidden_dim: 512
    dim_feedforward: 3200
    state_dim: 4

train:
  lr: 1.0e-5
  num_epochs: 2000
  batch_size: 4
  seed: 0
  device: cuda
  num_workers: 4
  prefetch_factor: 2
  persistent_workers: true
  pin_memory: true
  split_seed: 0
  train_split_ratio: 0.8571428571428571
  reuse_split: true
  split_path: /data/pingfan/Excavator_real_stack_data/g48_new_trainval_view_v1/train_val_split.yaml
  val_every: 10
  save_latest_every: 100
  checkpoint_every: 500
  checkpoint_keep_last: 3
  plot_every: 500
  amp: true
  amp_dtype: auto
  ckpt_dir: /data/pingfan/Excavator_real_stack_data/runs/g49_new_data_first_batch_20260714/training_runs/n2_new_eye2_effective_action_2000/ckpt
  image_transform: none
  state_hold_transition:
    enabled: false
  effective_action:
    enabled: true
    threshold_json: /data/pingfan/Excavator_real_stack_data/usb_hdf5_qc_20260708_72_104/runs/goal_state_hold_liveness_20260712/h2_transition_state_hold_finetune_e16_200/direct_policy_output_mechanical_deadzone.json
    neutral_weight: 1.0
    active_weight: 1.5
    persistent_weight: 1.75
    transition_weight: 4.0
    transition_window_steps: 4
    persistence_steps: 4
    active_margin: 0.02
    raw_continuity_weight: 0.35
    # New-train-only inverse-frequency ratios, normalized to neutral=1.
    # Counts: neutral=204941, positive=44973, negative=42550.
    class_weights: [1.0, 4.556979, 4.816475]
    classification_weight: 0.05
    magnitude_weight: 0.10
