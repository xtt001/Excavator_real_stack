# [G50: N5 data-volume ablation, 40 train episodes, 60k optimizer steps]
experiment_contract:
  experiment_id: g50_n5_fourcam_transition_data40_equal_steps
  comparison_role: data_volume_ablation_equal_optimizer_steps
  expected_num_epochs: 6000
  expected_camera_names: [video4, video5, video6, video7]
  camera_role_encoding_enabled: true
  deadzone_loss_enabled: true
  state_hold_transition_enabled: true
  effective_action_enabled: false
  policy_action_scale: [1.0, 1.0, 1.0, 1.0]
  forbidden_source_episode_ids: [105, 106, 107, 108, 109]
  forbidden_legacy_heldout_dataset: /data/pingfan/Excavator_real_stack_data/usb_hdf5_qc_20260709_105_109/real_teleop_v1_episodes_105_109_20hz

task:
  task_name: real_gmsl_fourcam_g50_n5_data40_equal_steps
  equipment_model: real_excavator
  dataset_dir: /data/pingfan/Excavator_real_stack_data/g50_new_n40_trainval_view_v1
  train_ready_manifest_path: /data/pingfan/Excavator_real_stack_data/g50_new_n40_trainval_view_v1/train_ready_manifest.json
  num_episodes: 1000000
  episode_len:
  camera_names: [video4, video5, video6, video7]
  backend:
    name: real
    dt: 0.05

policy:
  class: ACT
  device: cuda
  low_dim_keys: [qpos]
  act_params:
    chunk_size: 20
    kl_weight: 10.0
    hidden_dim: 512
    dim_feedforward: 3200
    state_dim: 4
    camera_role_encoding:
      enabled: true
      roles:
        video4: eye
        video5: eye
        video6: stick
        video7: stick

train:
  lr: 1.0e-5
  num_epochs: 6000
  batch_size: 4
  seed: 0
  device: cuda
  num_workers: 4
  prefetch_factor: 2
  persistent_workers: true
  pin_memory: true
  split_seed: 0
  train_split_ratio: 0.6666666666666666
  reuse_split: true
  split_path: /data/pingfan/Excavator_real_stack_data/g50_new_n40_trainval_view_v1/train_val_split.yaml
  val_every: 30
  save_latest_every: 300
  checkpoint_every: 1500
  checkpoint_keep_last: 3
  plot_every: 1500
  amp: true
  amp_dtype: auto
  ckpt_dir: /data/pingfan/Excavator_real_stack_data/runs/g50_n5_data_volume_ablation_20260715/training/n40_equal_steps/ckpt
  image_transform: none
  intent_loss:
    enabled: false
  deadzone_loss:
    enabled: true
    threshold_json: /data/pingfan/Excavator_real_stack_data/usb_hdf5_qc_20260708_72_104/runs/goal_state_hold_liveness_20260712/h2_transition_state_hold_finetune_e16_200/direct_policy_output_mechanical_deadzone.json
    same_dir_promote_weight: 1.0
    idle_suppression_weight: 0.0
    wrong_effective_weight: 0.0
    margin: 0.0
    same_dir_window: expert_transition_window
    same_dir_window_steps: 5
  state_hold_transition:
    enabled: true
    threshold_json: /data/pingfan/Excavator_real_stack_data/usb_hdf5_qc_20260708_72_104/runs/goal_state_hold_liveness_20260712/h2_transition_state_hold_finetune_e16_200/direct_policy_output_mechanical_deadzone.json
    probability: 0.5
    hold_horizon_steps: 20
  effective_action:
    enabled: false
