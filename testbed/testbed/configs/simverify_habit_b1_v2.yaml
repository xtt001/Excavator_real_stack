  equipment_model: real_excavator
  dataset_dir: /data/pingfan/Excavator_real_stack_data/sim_expert_habit_ready_cycle_v2/episodes
  num_episodes: 201
  episode_len:
  camera_names: [video4, video5, video6, video7]
  backend: {name: offline_recorded_observation, dt: 0.05}

policy:
  class: ACT
  device: cuda
  low_dim_keys: [qpos, qvel, cycle_condition_v1]
