      enabled: true
      roles: {video4: eye_left, video5: eye_right, video6: stick_down, video7: stick_up}

train:
  lr: 1.0e-5
  num_epochs: 2000
  batch_size: 4
  seed: 0
  device: cuda
  num_workers: 4
  prefetch_factor: 2
  persistent_workers: true
  pin_memory: true
  split_seed: 0
  train_split_ratio: 0.7761194029850746
  reuse_split: true
  split_path: /data/pingfan/Excavator_real_stack_data/sim_expert_habit_ready_cycle_v2/derived_split.yaml
  sample_valid_mask_path: conditions/valid_mask
  norm_stats_train_only: true
  condition_shuffle:
    enabled: false
    key: cycle_condition_v1
    scope: train_only
  image_transform: none
  val_every: 10
  save_latest_every: 100
  checkpoint_every: 500
  plot_every: 500
  amp: true
  amp_dtype: auto
  deadzone_loss:
    enabled: true
    thresholds:
      swing: {pos: 0.05, neg: 0.05}
      boom: {pos: 0.05, neg: 0.05}
      stick: {pos: 0.05, neg: 0.05}
      bucket: {pos: 0.05, neg: 0.05}
    same_dir_promote_weight: 1.0
    idle_suppression_weight: 0.0
