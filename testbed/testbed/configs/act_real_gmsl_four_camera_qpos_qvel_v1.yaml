# ACT offline training config for train-ready four-camera GMSL real data.
# This variant feeds qpos+qvel to ACT for comparison against the qpos-only
# baseline. Use the same train-ready manifest so eval differences reflect the
# low-dimensional input choice rather than data selection.

task:
  task_name: real_gmsl_four_camera_20hz_qpos_qvel_v1
  equipment_model: real_excavator
  dataset_dir: /media/mundane/EXTERNAL_USB/real_gmsl_four_camera_20hz_v1
  train_ready_manifest_path: /media/mundane/EXTERNAL_USB/real_gmsl_four_camera_20hz_v1/qc_full/train_ready_manifest.json
  num_episodes: 1000000
  episode_len:
  camera_names:
    - video4
    - video5
    - video6
    - video7
  backend:
    name: real
    dt: 0.05

policy:
  class: ACT
  device: cuda
  low_dim_keys:
    - qpos
    - qvel
  act_params:
    chunk_size: 20
    kl_weight: 10.0
    hidden_dim: 512
    dim_feedforward: 3200
    state_dim: 8

train:
  lr: 1.0e-5
  num_epochs: 2000
  batch_size: 4
  seed: 0
  device: cuda
  num_workers: 0
  prefetch_factor:
  persistent_workers: false
  pin_memory: true
  split_seed: 0
  train_split_ratio: 0.8
  reuse_split: true
  val_every: 5
  save_latest_every: 10
  checkpoint_every: 50
  plot_every: 50
  amp: true
  amp_dtype: auto
  ckpt_dir: runs/ckpts/real_gmsl_four_camera_20hz_qpos_qvel_v1
