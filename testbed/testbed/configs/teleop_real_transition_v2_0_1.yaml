# Expert-only continuous multi-sequence recording profile for v2.0.1.
#
# The session directory is intentionally not hard-coded. Pass the frozen field
# directory with --transition-session-dir (the field wrapper does this). This
# profile never loads a policy. It keeps the field-proven manual go-home flow.
extends: teleop_real_v1.yaml

teleop:
  num_episodes: 24
  metadata:
    session_id: ""
    notes: "v2.0.1 expert real-transition recording"
  joystick:
    record_start_button: null
    # Physical left-hand button 2 (pygame index 1) ARMs the whole session once.
    # Further presses do not create cycle annotations.
    mark_button: 1
    policy_start_button: null
    # Keep the field-proven physical button 3 and the established go-home flow.
    go_home_button: 2
    # Buttons 2/4 are task-reserved and must never become machine status toggles.
    status_reserved_buttons: [1, 3]
  recording:
    enabled: true
    wait_for_start: true
    go_home:
      enabled: true

task:
  task_name: real_transition_expert_v2_0_1
  dataset_dir: /media/mundane/EXTERNAL_USB/real_transition_raw_v2
  # The current authorized profile has at most five cycles. The runtime applies
  # the per-cycle timeout; this 50 Hz step ceiling is the matching final guard.
  max_steps: 15000
  param_version: real_transition_multisequence_v2_0_1

real_transition:
  enabled: true
  field_context_defaults:
    workface_reset_id_prefix: "wf_"
    workface_action: fresh_strip
  automatic_annotation:
    enabled: true
    # Matches the field joystick deadzone and the historical ready baseline.
    activity_action_abs_min: 0.05
    # Between runs, require one natural operator reposition before auto-start.
    require_inter_run_activity: true
  camera_sync:
    enabled: true
    expected_cameras: [video4, video5, video6, video7]
    stable_window_s: 2.0
    max_group_skew_ms: 5.0
    min_valid_fraction: 0.98
    min_distinct_groups: 30
  # Filled by --transition-session-dir on the field machine.
  session_dir: ""
  sequence_manifest: ""
  split_manifest: ""
  ready_contract: ""
  control:
    bind_host: "0.0.0.0"
    port: 8771
  time_limits:
    cycle_review_s: 45.0
    cycle_stop_s: 60.0
    run_stop_s_per_cycle: 60.0
