# 现场主从网络（可被环境变量 EXCAVATOR_SLAVE_IP 覆盖）
slave:
  ip: "192.168.100.1"
  hostname: "slave-jetson"  # SSH 别名；非 SSH 控制链路使用 ip
host:
  ip: "192.168.100.2"

ports:
  gateway: 8765      # testbed / gateway_server
  control_bridge: 8766  # excavator_real_bridge

ros2:
  domain_id: 42
  # Cyclone 单播 peer；组播正常时可不设
  host_peer_ip: "192.168.100.1"  # 主端填从端 IP
  slave_peer_ip: "192.168.100.2" # 从端填主端 IP
  host_bind_ip: "192.168.100.2"
  slave_bind_ip: "192.168.100.1"

paths:
  slave_dataset_dir: /data/real_teleop_v1
  host_dataset_dir: data/real_teleop_v1
