<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">本周真机结果</title>
  <desc id="desc">旧版本会让最终目标过早驱动回程，最终部署版先完成当前侧工作，再开放下一目标，并在真机上完成约一百三十二秒的连续动作。</desc>
  <defs>
    <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9FB1C2"/></marker>
  </defs>
  <rect width="1600" height="820" fill="#F4F7FB"/>
  <rect width="1600" height="12" fill="#3178F6"/>
  <text x="78" y="66" font-size="19" font-weight="700" fill="#3178F6">本周组会 · 2026.09.03</text>
  <text x="78" y="128" font-size="45" font-weight="700" fill="#102B4E">本周真机结果</text>
  <line x1="78" y1="154" x2="1522" y2="154" stroke="#CDD9E5" stroke-width="2"/>
  <text x="78" y="200" font-size="27" fill="#667A91">当前部署版先完成工作，再按目标回程，本轮出现过的直接回程问题没有再次发生。</text>

  <rect x="70" y="238" width="460" height="215" rx="22" fill="#FFFFFF" stroke="#D4DFEA" stroke-width="2"/>
  <rect x="70" y="238" width="10" height="215" fill="#E5484D"/>
  <text x="105" y="286" font-size="27" font-weight="700" fill="#E5484D">旧部署暴露的问题</text>
  <text x="105" y="342" font-size="23" fill="#102B4E">目标和脚本都提交正确</text>
  <text x="105" y="382" font-size="23" fill="#102B4E">模型却在第一步直接启动回程</text>
  <text x="105" y="422" font-size="21" fill="#667A91">机器跳过了当前侧的工作动作</text>

  <rect x="570" y="238" width="460" height="215" rx="22" fill="#FFFFFF" stroke="#D4DFEA" stroke-width="2"/>
  <rect x="570" y="238" width="10" height="215" fill="#F59E0B"/>
  <text x="605" y="286" font-size="27" font-weight="700" fill="#F59E0B">最终部署办法</text>
  <text x="605" y="342" font-size="23" fill="#102B4E">模型读取关节速度和任务阶段</text>
  <text x="605" y="382" font-size="23" fill="#102B4E">工作完成以后才开放下一目标</text>
  <text x="605" y="422" font-size="21" fill="#667A91">阶段改变时清空上一阶段的 ACT 预测</text>

  <rect x="1070" y="238" width="460" height="215" rx="22" fill="#FFFFFF" stroke="#D4DFEA" stroke-width="2"/>
  <rect x="1070" y="238" width="10" height="215" fill="#16A394"/>
  <text x="1105" y="286" font-size="27" font-weight="700" fill="#16A394">成功 rollout</text>
  <text x="1105" y="350" font-size="48" font-weight="700" fill="#16A394">132.4 秒</text>
  <text x="1105" y="394" font-size="23" fill="#102B4E">连续完成工作、卸料和回程</text>
  <text x="1105" y="430" font-size="21" fill="#667A91">视频中没有再次出现直接回程</text>

  <text x="78" y="515" font-size="27" font-weight="700" fill="#102B4E">视频中能够直接看到的动作顺序</text>
  <g font-size="21" font-weight="700" text-anchor="middle">
    <rect x="75" y="555" width="235" height="86" rx="18" fill="#E8F0FF"/><text x="192" y="607" fill="#3178F6">当前侧工作</text>
    <line x1="320" y1="598" x2="375" y2="598" stroke="#9FB1C2" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="390" y="555" width="235" height="86" rx="18" fill="#E8F0FF"/><text x="507" y="607" fill="#3178F6">抬升和卸料</text>
    <line x1="635" y1="598" x2="690" y2="598" stroke="#9FB1C2" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="705" y="555" width="235" height="86" rx="18" fill="#FFF1D6"/><text x="822" y="607" fill="#D98200">确认工作完成</text>
    <line x1="950" y1="598" x2="1005" y2="598" stroke="#9FB1C2" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="1020" y="555" width="235" height="86" rx="18" fill="#E1F6F2"/><text x="1137" y="607" fill="#168C80">按目标回程</text>
    <line x1="1265" y1="598" x2="1320" y2="598" stroke="#9FB1C2" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="1335" y="555" width="190" height="86" rx="18" fill="#E1F6F2"/><text x="1430" y="607" fill="#168C80">到达下一侧</text>
  </g>

  <rect x="160" y="690" width="1280" height="78" rx="20" fill="#102F4A"/>
  <text x="800" y="739" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">最终目标决定回到哪一侧，任务阶段决定这个目标何时生效。</text>
</svg>
