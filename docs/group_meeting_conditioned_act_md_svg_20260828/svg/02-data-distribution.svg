<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">左右目标只在回转停止前产生差别</title>
  <desc id="svg-desc">左右目标在一整铲中有百分之九十四以上的动作相同，真正的差别集中在回程经过右区、需要决定继续回转还是停下的时刻。</desc>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9FB1C2"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", Arial, sans-serif; }
    </style>
  </defs>
  <rect width="1600" height="760" fill="#F4F7FB"/>
  <rect width="1600" height="12" fill="#2F6FED"/>
  <text x="78" y="68" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#2F6FED">本周组会 · 2026.08.28</text>
  <text x="78" y="128" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="45" font-weight="700" fill="#102A43">左右目标只在回转停止前产生差别</text>
  <line x1="78" y1="154" x2="1522" y2="154" stroke="#D5E0EA" stroke-width="2"/>
<text x="78" y="198" font-size="27" fill="#62748A" font-weight="400" text-anchor="start">一整铲里，模型在左右目标下的大多数动作都相同，只有停下前的一小段不同。</text>
<text x="95" y="255" font-size="27" fill="#102A43" font-weight="700" text-anchor="start">一整铲的动作顺序</text>
<rect x="95" y="290" width="180" height="82" rx="16" fill="#B9C7D5" stroke="#B9C7D5" stroke-width="2"/>
<text x="185.0" y="342" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">挖掘</text>
<rect x="285" y="290" width="240" height="82" rx="16" fill="#9EB1C4" stroke="#9EB1C4" stroke-width="2"/>
<text x="405.0" y="342" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">抬升与装载</text>
<rect x="535" y="290" width="300" height="82" rx="16" fill="#7894AD" stroke="#7894AD" stroke-width="2"/>
<text x="685.0" y="342" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">正向回转卸料</text>
<rect x="845" y="290" width="350" height="82" rx="16" fill="#4D789D" stroke="#4D789D" stroke-width="2"/>
<text x="1020.0" y="342" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">共同负向回转</text>
<rect x="1205" y="290" width="300" height="82" rx="16" fill="#F59E0B" stroke="#F59E0B" stroke-width="2"/>
<text x="1355.0" y="342" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">继续回转或停下</text>
<text x="95" y="438" font-size="27" fill="#102A43" font-weight="700" text-anchor="start">训练时间步分布</text>
<rect x="95" y="470" width="1410" height="78" rx="18" fill="#DCE5ED" stroke="#DCE5ED" stroke-width="2"/>
<rect x="1422" y="470" width="83" height="78" rx="18" fill="#F59E0B" stroke="#F59E0B" stroke-width="2"/>
<text x="758.5" y="520" font-size="27" fill="#102A43" font-weight="700" text-anchor="middle">两种目标下相同的动作 94.15%</text>
<line x1="1422" y1="460" x2="1422" y2="560" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
<text x="1505" y="590" font-size="25" fill="#F59E0B" font-weight="700" text-anchor="end">目标可能影响动作的区间 5.85%</text>
<line x1="1432" y1="554" x2="1464" y2="574" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
<rect x="95" y="618" width="1410" height="92" rx="24" fill="#FFFFFF" stroke="#D5E0EA" stroke-width="2"/>
<text x="130" y="674" font-size="27" fill="#D94848" font-weight="700" text-anchor="start">真正能比较左右动作的起始时刻只有 1.86%</text>
<text x="770" y="674" font-size="26" fill="#172B4D" font-weight="600" text-anchor="start">如果整段平均训练，这些少量时刻很容易被大量相同动作盖住。</text>
</svg>
