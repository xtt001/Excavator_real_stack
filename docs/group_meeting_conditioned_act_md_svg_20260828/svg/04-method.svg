<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 910" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">最终训练方案</title>
  <desc id="svg-desc">训练只选择目标释放区间，损失直接要求左区继续回转、右区停止，并保留动作间隔。</desc>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9FB1C2"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", Arial, sans-serif; }
    </style>
  </defs>
  <rect width="1600" height="910" fill="#F4F7FB"/>
  <rect width="1600" height="12" fill="#2F6FED"/>
  <text x="78" y="68" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#2F6FED">本周组会 · 2026.08.28</text>
  <text x="78" y="128" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="45" font-weight="700" fill="#102A43">最终训练方案</text>
  <line x1="78" y1="154" x2="1522" y2="154" stroke="#D5E0EA" stroke-width="2"/>
<rect x="85" y="220" width="290" height="98" rx="24" fill="#EAF1FF" stroke="#EAF1FF" stroke-width="2"/>
<text x="230.0" y="281" font-size="25" fill="#2F6FED" font-weight="700" text-anchor="middle">图像 + 关节状态</text>
<rect x="445" y="220" width="270" height="98" rx="24" fill="#FFF5DF" stroke="#FFF5DF" stroke-width="2"/>
<text x="580.0" y="281" font-size="25" fill="#F59E0B" font-weight="700" text-anchor="middle">只选择释放阶段 M(t)</text>
<rect x="785" y="220" width="280" height="98" rx="24" fill="#E8F8F5" stroke="#E8F8F5" stroke-width="2"/>
<text x="925.0" y="281" font-size="25" fill="#12A594" font-weight="700" text-anchor="middle">左区 / 右区目标</text>
<rect x="1135" y="220" width="380" height="98" rx="24" fill="#F1EBFF" stroke="#F1EBFF" stroke-width="2"/>
<text x="1325.0" y="281" font-size="25" fill="#8356E8" font-weight="700" text-anchor="middle">模型直接输出的动作序列</text>
<line x1="385" y1="269" x2="433" y2="269" stroke="#A9B9C8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowhead)"/>
<line x1="725" y1="269" x2="773" y2="269" stroke="#A9B9C8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowhead)"/>
<line x1="1075" y1="269" x2="1123" y2="269" stroke="#A9B9C8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowhead)"/>
<text x="85" y="382" font-size="29" fill="#102A43" font-weight="700" text-anchor="start">回转释放损失</text>
<rect x="85" y="410" width="1430" height="108" rx="22" fill="#102A43" stroke="#102A43" stroke-width="2"/>
<text x="800" y="478" font-size="31" fill="#FFFFFF" font-weight="700" text-anchor="middle">L_release = max(0, m + a_left) + |a_right| + max(0, m − (a_right − a_left))</text>
<rect x="85" y="560" width="430" height="132" rx="24" fill="#FFFFFF" stroke="#D5E0EA" stroke-width="2"/>
<rect x="113" y="584" width="138" height="44" rx="22" fill="#12A594" stroke="#12A594" stroke-width="2"/>
<text x="182.0" y="613.2" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle">左区目标</text>
<text x="280" y="616" font-size="25" fill="#12A594" font-weight="700" text-anchor="start">a_left ≤ −m</text>
<text x="113" y="665" font-size="23" fill="#172B4D" font-weight="600" text-anchor="start">继续回转并越过死区</text>
<rect x="565" y="560" width="430" height="132" rx="24" fill="#FFFFFF" stroke="#D5E0EA" stroke-width="2"/>
<rect x="593" y="584" width="138" height="44" rx="22" fill="#2F6FED" stroke="#2F6FED" stroke-width="2"/>
<text x="662.0" y="613.2" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle">右区目标</text>
<text x="760" y="616" font-size="25" fill="#2F6FED" font-weight="700" text-anchor="start">a_right = 0</text>
<text x="593" y="665" font-size="23" fill="#172B4D" font-weight="600" text-anchor="start">在右区回零停止</text>
<rect x="1045" y="560" width="430" height="132" rx="24" fill="#FFFFFF" stroke="#D5E0EA" stroke-width="2"/>
<rect x="1073" y="584" width="138" height="44" rx="22" fill="#F59E0B" stroke="#F59E0B" stroke-width="2"/>
<text x="1142.0" y="613.2" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle">动作间隔</text>
<text x="1240" y="616" font-size="25" fill="#F59E0B" font-weight="700" text-anchor="start">a_right − a_left ≥ m</text>
<text x="1073" y="665" font-size="23" fill="#172B4D" font-weight="600" text-anchor="start">为泛化误差预留余量</text>
<rect x="85" y="728" width="274" height="96" rx="24" fill="#FFFFFF" stroke="#D5E0EA" stroke-width="2"/>
<text x="105" y="764" font-size="20" fill="#62748A" font-weight="700" text-anchor="start">决策区</text>
<text x="105" y="805" font-size="23" fill="#2F6FED" font-weight="700" text-anchor="start">0.111–0.393 弧度</text>
<rect x="371" y="728" width="274" height="96" rx="24" fill="#FFFFFF" stroke="#D5E0EA" stroke-width="2"/>
<text x="391" y="764" font-size="20" fill="#62748A" font-weight="700" text-anchor="start">负向死区</text>
<text x="391" y="805" font-size="23" fill="#2F6FED" font-weight="700" text-anchor="start">0.721</text>
<rect x="657" y="728" width="274" height="96" rx="24" fill="#FFFFFF" stroke="#D5E0EA" stroke-width="2"/>
<text x="677" y="764" font-size="20" fill="#62748A" font-weight="700" text-anchor="start">动作余量 m</text>
<text x="677" y="805" font-size="23" fill="#2F6FED" font-weight="700" text-anchor="start">0.799</text>
<rect x="943" y="728" width="274" height="96" rx="24" fill="#FFFFFF" stroke="#D5E0EA" stroke-width="2"/>
<text x="963" y="764" font-size="20" fill="#62748A" font-weight="700" text-anchor="start">持续窗口</text>
<text x="963" y="805" font-size="23" fill="#2F6FED" font-weight="700" text-anchor="start">5 帧 / 0.25 秒</text>
<rect x="1229" y="728" width="274" height="96" rx="24" fill="#FFFFFF" stroke="#D5E0EA" stroke-width="2"/>
<text x="1249" y="764" font-size="20" fill="#62748A" font-weight="700" text-anchor="start">损失权重</text>
<text x="1249" y="805" font-size="23" fill="#2F6FED" font-weight="700" text-anchor="start">0.503</text>
<text x="800" y="870" font-size="25" fill="#D94848" font-weight="700" text-anchor="middle">共同阶段仍由原有模仿训练学习；新增要求只作用于目标真正改变动作的释放区间。</text>
</svg>
