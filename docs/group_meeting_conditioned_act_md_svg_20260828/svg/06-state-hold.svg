<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">机器卡住时，模型会不会再次发力</title>
  <desc id="svg-desc">测试先重放真实记录来还原模型到达测试点时的状态，然后固定图像、位置和目标，把速度设为零，让模型连续判断二十次，并与原模型比较。</desc>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9FB1C2"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", Arial, sans-serif; }
    </style>
  </defs>
  <rect width="1600" height="940" fill="#F4F7FB"/>
  <rect width="1600" height="12" fill="#2F6FED"/>
  <text x="78" y="68" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#2F6FED">本周组会 · 2026.08.28</text>
  <text x="78" y="128" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="45" font-weight="700" fill="#102A43">机器卡住时，模型会不会再次发力</text>
  <line x1="78" y1="154" x2="1522" y2="154" stroke="#D5E0EA" stroke-width="2"/>
<text x="78" y="198" font-size="25" fill="#62748A" font-weight="400" text-anchor="start">如果命令没有越过死区，机器就不会动，模型下一次看到的还是同一个状态。这个测试复现的就是这种情况。</text>
<rect x="70" y="235" width="315" height="168" rx="24" fill="#FFFFFF" stroke="#D5E0EA" stroke-width="2"/>
<rect x="70" y="235" width="315" height="54" rx="20" fill="#2F6FED" stroke="#2F6FED" stroke-width="2"/>
<text x="227.5" y="272" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">1. 找出机器刚要动的时刻</text>
<text x="94" y="322" font-size="17" fill="#172B4D" font-weight="500" text-anchor="start">人工驾驶的回转命令刚越过死区</text>
<text x="94" y="349" font-size="17" fill="#172B4D" font-weight="500" text-anchor="start">代码按轴和方向标记测试点</text>
<text x="94" y="376" font-size="17" fill="#172B4D" font-weight="500" text-anchor="start">并排除无效样本</text>
<rect x="455" y="235" width="315" height="168" rx="24" fill="#FFFFFF" stroke="#D5E0EA" stroke-width="2"/>
<rect x="455" y="235" width="315" height="54" rx="20" fill="#8356E8" stroke="#8356E8" stroke-width="2"/>
<text x="612.5" y="272" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">2. 重放此前记录</text>
<text x="479" y="322" font-size="17" fill="#172B4D" font-weight="500" text-anchor="start">代码逐帧读取测试点前的数据</text>
<text x="479" y="349" font-size="17" fill="#172B4D" font-weight="500" text-anchor="start">模型因此重新看到</text>
<text x="479" y="376" font-size="17" fill="#172B4D" font-weight="500" text-anchor="start">此前的图像和机器状态</text>
<rect x="840" y="235" width="315" height="168" rx="24" fill="#FFFFFF" stroke="#D5E0EA" stroke-width="2"/>
<rect x="840" y="235" width="315" height="54" rx="20" fill="#F59E0B" stroke="#F59E0B" stroke-width="2"/>
<text x="997.5" y="272" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">3. 每次回到同一状态</text>
<text x="864" y="322" font-size="17" fill="#172B4D" font-weight="500" text-anchor="start">代码保存模型的内部记录</text>
<text x="864" y="349" font-size="17" fill="#172B4D" font-weight="500" text-anchor="start">每次测试前都恢复这份记录</text>
<text x="864" y="376" font-size="17" fill="#172B4D" font-weight="500" text-anchor="start">图像、位置和目标不变，速度为零</text>
<rect x="1225" y="235" width="315" height="168" rx="24" fill="#FFFFFF" stroke="#D5E0EA" stroke-width="2"/>
<rect x="1225" y="235" width="315" height="54" rx="20" fill="#12A594" stroke="#12A594" stroke-width="2"/>
<text x="1382.5" y="272" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">4. 让模型连续判断</text>
<text x="1249" y="322" font-size="17" fill="#172B4D" font-weight="500" text-anchor="start">让模型对同一份数据判断二十次</text>
<text x="1249" y="349" font-size="17" fill="#172B4D" font-weight="500" text-anchor="start">测试不更新机器状态</text>
<text x="1249" y="376" font-size="17" fill="#172B4D" font-weight="500" text-anchor="start">也不读取人工驾驶的下一帧</text>
<line x1="395" y1="310" x2="443" y2="310" stroke="#9FB1C2" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowhead)"/>
<line x1="780" y1="310" x2="828" y2="310" stroke="#9FB1C2" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowhead)"/>
<line x1="1165" y1="310" x2="1213" y2="310" stroke="#9FB1C2" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowhead)"/>
<text x="80" y="446" font-size="27" fill="#102A43" font-weight="700" text-anchor="start">怎样保证每次测试公平</text>
<rect x="80" y="474" width="400" height="118" rx="24" fill="#FFFFFF" stroke="#D5E0EA" stroke-width="2"/>
<circle cx="118" cy="533" r="23" fill="#2F6FED"/>
<text x="118" y="541" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text x="158" y="519" font-size="21" fill="#2F6FED" font-weight="700" text-anchor="start">先重放真实记录</text>
<text x="158" y="556" font-size="18" fill="#172B4D" font-weight="400" text-anchor="start">代码逐帧运行到测试点</text>
<rect x="600" y="474" width="400" height="118" rx="24" fill="#FFFFFF" stroke="#D5E0EA" stroke-width="2"/>
<circle cx="638" cy="533" r="23" fill="#F59E0B"/>
<text x="638" y="541" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<text x="678" y="519" font-size="21" fill="#F59E0B" font-weight="700" text-anchor="start">保存模型此时的记录</text>
<text x="678" y="556" font-size="18" fill="#172B4D" font-weight="400" text-anchor="start">每项测试前都恢复这份记录</text>
<rect x="1120" y="474" width="400" height="118" rx="24" fill="#FFFFFF" stroke="#D5E0EA" stroke-width="2"/>
<circle cx="1158" cy="533" r="23" fill="#12A594"/>
<text x="1158" y="541" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text x="1198" y="519" font-size="21" fill="#12A594" font-weight="700" text-anchor="start">逐项测试后继续回放</text>
<text x="1198" y="556" font-size="18" fill="#172B4D" font-weight="400" text-anchor="start">测试结束后恢复记录，再读取后续数据</text>
<line x1="490" y1="533" x2="585" y2="533" stroke="#9FB1C2" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowhead)"/>
<line x1="1010" y1="533" x2="1105" y2="533" stroke="#9FB1C2" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowhead)"/>
<text x="80" y="650" font-size="27" fill="#102A43" font-weight="700" text-anchor="start">测试检查什么</text>
<rect x="80" y="680" width="330" height="102" rx="24" fill="#FFFFFF" stroke="#D5E0EA" stroke-width="2"/>
<rect x="80" y="680" width="7" height="102" fill="#2F6FED"/>
<text x="104" y="720" font-size="21" fill="#2F6FED" font-weight="700" text-anchor="start">5 次内给对动作</text>
<text x="104" y="755" font-size="17" fill="#172B4D" font-weight="400" text-anchor="start">只用来观察反应快慢，不作为最终门槛</text>
<rect x="450" y="680" width="330" height="102" rx="24" fill="#FFFFFF" stroke="#D5E0EA" stroke-width="2"/>
<rect x="450" y="680" width="7" height="102" fill="#12A594"/>
<text x="474" y="720" font-size="21" fill="#12A594" font-weight="700" text-anchor="start">20 次内给对动作</text>
<text x="474" y="755" font-size="17" fill="#172B4D" font-weight="400" text-anchor="start">机器没有动时，能否再次发出有效命令</text>
<rect x="820" y="680" width="330" height="102" rx="24" fill="#FFFFFF" stroke="#D5E0EA" stroke-width="2"/>
<rect x="820" y="680" width="7" height="102" fill="#D94848"/>
<text x="844" y="720" font-size="21" fill="#D94848" font-weight="700" text-anchor="start">第一次就给错动作</text>
<text x="844" y="755" font-size="17" fill="#172B4D" font-weight="400" text-anchor="start">目标轴方向相反，或其他轴出现多余动作</text>
<rect x="1190" y="680" width="330" height="102" rx="24" fill="#FFFFFF" stroke="#D5E0EA" stroke-width="2"/>
<rect x="1190" y="680" width="7" height="102" fill="#F59E0B"/>
<text x="1214" y="720" font-size="21" fill="#F59E0B" font-weight="700" text-anchor="start">区分启动和动作中</text>
<text x="1214" y="755" font-size="17" fill="#172B4D" font-weight="400" text-anchor="start">第一个测试点单独统计，避免平均数盖住启动问题</text>
<rect x="80" y="820" width="1440" height="76" rx="18" fill="#102A43" stroke="#102A43" stroke-width="2"/>
<text x="120" y="851" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="start">新旧模型使用同一批数据、同一批测试点和同一张死区表：</text>
<text x="900" y="851" font-size="21" fill="#76E0D1" font-weight="700" text-anchor="start">开发 67.5% ≥ 55.4%，错误 26 ≤ 38</text>
<text x="900" y="880" font-size="21" fill="#76E0D1" font-weight="700" text-anchor="start">留出 59.7% ≥ 58.4%，错误 29 ≤ 53</text>
</svg>
