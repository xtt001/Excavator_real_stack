<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 790" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">本周任务与时间线</title>
  <desc id="svg-desc">本周先从训练数据中找出左右目标真正需要不同动作的时刻，再比较三种训练办法、训练模型并完成离线测试。</desc>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9FB1C2"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", Arial, sans-serif; }
    </style>
  </defs>
  <rect width="1600" height="790" fill="#F4F7FB"/>
  <rect width="1600" height="12" fill="#2F6FED"/>
  <text x="78" y="68" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#2F6FED">本周组会 · 2026.08.28</text>
  <text x="78" y="128" font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="45" font-weight="700" fill="#102A43">本周任务与时间线</text>
  <line x1="78" y1="154" x2="1522" y2="154" stroke="#D5E0EA" stroke-width="2"/>
<text x="78" y="195" font-size="27" fill="#62748A" font-weight="400" text-anchor="start">本周只检查两件事：模型是否听从左右目标，模型原来的表现有没有变差。</text>
<rect x="70" y="230" width="460" height="156" rx="24" fill="#FFFFFF" stroke="#D5E0EA" stroke-width="2"/>
<rect x="70" y="230" width="9" height="156" fill="#12A594"/>
<text x="102" y="276" font-size="27" fill="#12A594" font-weight="700" text-anchor="start">让模型听从左右目标</text>
<text x="102" y="324" font-size="22" fill="#172B4D" font-weight="500" text-anchor="start">目标在左区时，模型继续回转</text>
<text x="102" y="360" font-size="22" fill="#172B4D" font-weight="500" text-anchor="start">目标在右区时，模型停下</text>
<rect x="570" y="230" width="460" height="156" rx="24" fill="#FFFFFF" stroke="#D5E0EA" stroke-width="2"/>
<rect x="570" y="230" width="9" height="156" fill="#F59E0B"/>
<text x="602" y="276" font-size="27" fill="#F59E0B" font-weight="700" text-anchor="start">保持原有表现</text>
<text x="602" y="324" font-size="22" fill="#172B4D" font-weight="500" text-anchor="start">模型照常完成挖掘、卸料和回程</text>
<text x="602" y="360" font-size="22" fill="#172B4D" font-weight="500" text-anchor="start">机器卡住时，模型仍能再次发力</text>
<rect x="1070" y="230" width="460" height="156" rx="24" fill="#FFFFFF" stroke="#D5E0EA" stroke-width="2"/>
<rect x="1070" y="230" width="9" height="156" fill="#2F6FED"/>
<text x="1102" y="276" font-size="27" fill="#2F6FED" font-weight="700" text-anchor="start">两项一起过关</text>
<text x="1102" y="324" font-size="22" fill="#172B4D" font-weight="500" text-anchor="start">开发验证集和独立留出集</text>
<text x="1102" y="360" font-size="22" fill="#172B4D" font-weight="500" text-anchor="start">都要同时满足两项要求</text>
<text x="78" y="450" font-size="27" fill="#102A43" font-weight="700" text-anchor="start">本周做了六步</text>
<rect x="70" y="490" width="210" height="158" rx="24" fill="#FFFFFF" stroke="#D5E0EA" stroke-width="2"/>
<circle cx="102" cy="526" r="21" fill="#2F6FED"/>
<text x="102" y="534" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text x="132" y="535" font-size="21" fill="#102A43" font-weight="700" text-anchor="start">先看训练数据</text>
<text x="90" y="585" font-size="17" fill="#62748A" font-weight="500" text-anchor="start">找出左右动作</text>
<text x="90" y="613" font-size="17" fill="#62748A" font-weight="500" text-anchor="start">真正不同的时刻</text>
<rect x="310" y="490" width="210" height="158" rx="24" fill="#FFFFFF" stroke="#D5E0EA" stroke-width="2"/>
<circle cx="342" cy="526" r="21" fill="#D94848"/>
<text x="342" y="534" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<text x="372" y="535" font-size="21" fill="#102A43" font-weight="700" text-anchor="start">试三种办法</text>
<text x="330" y="585" font-size="17" fill="#62748A" font-weight="500" text-anchor="start">直接检查动作</text>
<text x="330" y="613" font-size="17" fill="#62748A" font-weight="500" text-anchor="start">有没有改变</text>
<rect x="550" y="490" width="210" height="158" rx="24" fill="#FFFFFF" stroke="#D5E0EA" stroke-width="2"/>
<circle cx="582" cy="526" r="21" fill="#12A594"/>
<text x="582" y="534" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text x="612" y="535" font-size="21" fill="#102A43" font-weight="700" text-anchor="start">定下训练办法</text>
<text x="570" y="585" font-size="17" fill="#62748A" font-weight="500" text-anchor="start">确定取样时刻</text>
<text x="570" y="613" font-size="17" fill="#62748A" font-weight="500" text-anchor="start">动作要求和权重</text>
<rect x="790" y="490" width="210" height="158" rx="24" fill="#FFFFFF" stroke="#D5E0EA" stroke-width="2"/>
<circle cx="822" cy="526" r="21" fill="#8356E8"/>
<text x="822" y="534" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
<text x="852" y="535" font-size="21" fill="#102A43" font-weight="700" text-anchor="start">训练并选择模型</text>
<text x="810" y="585" font-size="17" fill="#62748A" font-weight="500" text-anchor="start">按离线动作表现选</text>
<text x="810" y="613" font-size="17" fill="#62748A" font-weight="500" text-anchor="start">不只看损失</text>
<rect x="1030" y="490" width="210" height="158" rx="24" fill="#FFFFFF" stroke="#D5E0EA" stroke-width="2"/>
<circle cx="1062" cy="526" r="21" fill="#F59E0B"/>
<text x="1062" y="534" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text>
<text x="1092" y="535" font-size="21" fill="#102A43" font-weight="700" text-anchor="start">跑离线测试</text>
<text x="1050" y="585" font-size="17" fill="#62748A" font-weight="500" text-anchor="start">跑完整记录并检查</text>
<text x="1050" y="613" font-size="17" fill="#62748A" font-weight="500" text-anchor="start">左右目标和卡住情况</text>
<rect x="1270" y="490" width="210" height="158" rx="24" fill="#FFFFFF" stroke="#D5E0EA" stroke-width="2"/>
<circle cx="1302" cy="526" r="21" fill="#183B56"/>
<text x="1302" y="534" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">6</text>
<text x="1332" y="535" font-size="21" fill="#102A43" font-weight="700" text-anchor="start">给出结论</text>
<text x="1290" y="585" font-size="17" fill="#62748A" font-weight="500" text-anchor="start">说明已经做到什么</text>
<text x="1290" y="613" font-size="17" fill="#62748A" font-weight="500" text-anchor="start">还要上机确认什么</text>
<line x1="282" y1="569" x2="305" y2="569" stroke="#9FB1C2" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowhead)"/>
<line x1="522" y1="569" x2="545" y2="569" stroke="#9FB1C2" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowhead)"/>
<line x1="762" y1="569" x2="785" y2="569" stroke="#9FB1C2" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowhead)"/>
<line x1="1002" y1="569" x2="1025" y2="569" stroke="#9FB1C2" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowhead)"/>
<line x1="1242" y1="569" x2="1265" y2="569" stroke="#9FB1C2" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowhead)"/>
<rect x="210" y="690" width="1180" height="64" rx="18" fill="#102A43" stroke="#102A43" stroke-width="2"/>
<text x="800" y="732" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">从训练到离线测试，这两项要求始终一起检查。</text>
</svg>
